name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please fill in the sections below.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a server on port 3000
        2. Run `portpeek 3000`
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Command output
      description: Paste output from `portpeek version` and the failing command. Use `--json` where possible.
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privileges
    attributes:
      label: Privileges
      options:
        - label: I ran the command with sudo (or as Administrator)
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues
          required: true
